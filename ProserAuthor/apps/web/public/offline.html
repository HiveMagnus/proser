<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#6d28d9" />
    <title>Proser is offline</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b0b10;
        color: #e8e6f0;
        font:
          16px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      main {
        max-width: 32rem;
        padding: 1.5rem;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.75rem;
      }
      p {
        color: #b9b5c9;
      }
      a {
        display: inline-block;
        margin-top: 0.5rem;
        padding: 0.6rem 1.1rem;
        border-radius: 0.5rem;
        background: #6d28d9;
        color: #fff;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="" width="48" height="48" />
      <h1>You are offline</h1>
      <p>
        Proser needs a connection to open a page. Nothing you wrote is lost: drafts, including Quick
        Draft, are kept on this device until they are saved to your book.
      </p>
      <p>
        When you are back online, open Proser again. Your unsaved drafts come back and you can
        continue and save them.
      </p>
      <a href="/m">Try again</a>
    </main>
  </body>
</html>
