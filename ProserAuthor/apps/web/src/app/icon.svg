<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>
  <!-- Book cover -->
  <rect x="4" y="3" width="22" height="26" rx="2" fill="url(#cover)"/>
  <!-- Spine shadow -->
  <rect x="4" y="3" width="4" height="26" rx="1" fill="#4c1d95" opacity="0.5"/>
  <!-- Pages -->
  <rect x="9" y="5" width="15" height="22" rx="1" fill="#f5f3ff"/>
  <!-- Text lines -->
  <rect x="11" y="9" width="11" height="1.5" rx="0.5" fill="#c4b5fd"/>
  <rect x="11" y="13" width="9" height="1.5" rx="0.5" fill="#c4b5fd"/>
  <rect x="11" y="17" width="11" height="1.5" rx="0.5" fill="#c4b5fd"/>
  <rect x="11" y="21" width="7" height="1.5" rx="0.5" fill="#c4b5fd"/>
  <!-- Pen nib -->
  <g transform="translate(22,2) rotate(30)">
    <rect x="0" y="0" width="2.5" height="10" rx="0.5" fill="#f59e0b"/>
    <polygon points="0.2,10 2.3,10 1.25,13" fill="#1e1b4b"/>
  </g>
</svg>
