services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    container_name: proser-web
    ports:
      - '${WEB_PORT:-3000}:3000'
    environment:
      PORT: '3000'
      NODE_ENV: production
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      FACTORY_AUTH_SECRET: ${FACTORY_AUTH_SECRET:?FACTORY_AUTH_SECRET is required}
      FACTORY_AUTH_ISSUER: ${FACTORY_AUTH_ISSUER:-proser-author}
      FACTORY_AUTH_AUDIENCE: ${FACTORY_AUTH_AUDIENCE:-proser-factory}
      FACTORY_URL: ${FACTORY_URL:?Set FACTORY_URL to a reachable Factory origin}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    restart: unless-stopped
