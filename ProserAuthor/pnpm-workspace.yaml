packages:
  - 'apps/web'
  - 'packages/*'

allowBuilds:
  esbuild: true
  sharp: true

minimumReleaseAgeExclude:
  - '@hivemagnus/canvas-word-engine@1.2.2'

overrides:
  '@babel/core': '^7.29.1'
  esbuild: '^0.28.1'
  linkify-it: '^5.0.1'
  markdown-it: '^14.1.2'
  postcss: '^8.5.32'
  sharp: '0.35.5'
  source-map-js: '1.2.2'

  nanoid@3: '3.3.18'
  browserslist: '4.28.7'
  baseline-browser-mapping: '2.11.0'

  brace-expansion: '5.0.12'
  minimatch: '11.0.3'
  undici: '7.30.1'
