version: 2
updates:
  # Keep the commit-pinned workflow actions current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # Keep the digest-pinned application base image current.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # The Node major moves together with .nvmrc and the package engines.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  # Keep the digest-pinned PostgreSQL and Redis images in compose.yml current.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      - dependency-name: redis
        update-types: ["version-update:semver-major"]
