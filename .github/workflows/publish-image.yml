name: Publish Proser image

on:
  push:
    tags: ["v*"]
  # A manual run builds and tests both architectures and never publishes.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proser-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acceptance:
    if: github.repository == 'HiveMagnus/proser'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    outputs:
      revision: ${{ steps.tag.outputs.revision }}
      version: ${{ steps.tag.outputs.version }}
      previous: ${{ steps.tag.outputs.previous }}
      publish: ${{ steps.tag.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the release tag on main
        id: tag
        run: |
          set -euo pipefail
          revision=$(git rev-parse HEAD)
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            git merge-base --is-ancestor "$revision" refs/remotes/origin/main
            version=${GITHUB_REF_NAME#v}
            publish=true
            # The packages must name the release, so source checkouts report it too.
            for manifest in package.json ProserFactory/package.json; do
              declared=$(node -p "require('./$manifest').version")
              if [ "$declared" != "$version" ]; then
                echo "$manifest declares $declared; set it to $version before tagging" >&2
                exit 1
              fi
            done
          else
            # A dry run tests the checked-out packages' version and publishes nothing.
            version=$(node -p "require('./package.json').version")
            publish=false
            echo "Dry run of $version at $revision: nothing is published" >> "$GITHUB_STEP_SUMMARY"
          fi
          # The upgrade test starts from the newest published release before this
          # version. A release tag whose image was never published is skipped.
          previous=
          while read -r tag; do
            if missing=$(docker manifest inspect "ghcr.io/hivemagnus/proser:${tag#v}" 2>&1 >/dev/null); then
              previous=$tag
              break
            fi
            grep -q 'manifest unknown' <<<"$missing" || { echo "$missing" >&2; exit 1; }
            echo "$tag has no published image; the upgrade test starts from an earlier release" >> "$GITHUB_STEP_SUMMARY"
          done < <(git tag --list 'v*' | grep -Ex 'v[0-9]+\.[0-9]+\.[0-9]+' | { cat; echo "v$version"; } \
            | sort -uV | awk -v current="v$version" '$0 == current { exit } { print }' | sort -rV)
          printf 'revision=%s\nversion=%s\nprevious=%s\npublish=%s\n' "$revision" "$version" "$previous" "$publish" >> "$GITHUB_OUTPUT"
      - name: Wait for verification and Gitleaks on the release tag
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ steps.tag.outputs.revision }}
        run: |
          set -euo pipefail
          for workflow in verify.yml gitleaks.yml; do
            for _ in $(seq 1 60); do
              status=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs" \
                -f event=push -f branch="$GITHUB_REF_NAME" -f head_sha="$REVISION" -f per_page=1 \
                --jq '.workflow_runs[0] | if .status == "completed" then .conclusion else "pending" end')
              case "$status" in
                success) break ;;
                pending) sleep 25 ;;
                *) echo "$workflow completed with $status" >&2; exit 1 ;;
              esac
            done
            test "$status" = success
          done

  # Each architecture builds and is tested on a native runner.
  build:
    needs: acceptance
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      REVISION: ${{ needs.acceptance.outputs.revision }}
      VERSION: ${{ needs.acceptance.outputs.version }}
      PREVIOUS: ${{ needs.acceptance.outputs.previous }}
      PLATFORM: linux/${{ matrix.arch }}
      ARCH: ${{ matrix.arch }}
      IMAGE: ghcr.io/hivemagnus/proser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.acceptance.outputs.revision }}
          # Release tags give the upgrade test the previous release's Compose files.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Build the versioned image for this architecture
        run: |
          docker build --platform "$PLATFORM" --build-arg PROSER_REVISION="$REVISION" --build-arg PROSER_VERSION="$VERSION" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label org.opencontainers.image.title=Proser \
            --label org.opencontainers.image.licenses=Apache-2.0 \
            --tag "$IMAGE:$VERSION" .
          test "$(docker image inspect "$IMAGE:$VERSION" --format '{{.Os}}/{{.Architecture}}')" = "$PLATFORM"
      - name: Check image layers and scan application files for secrets
        run: |
          docker run --rm --network none --entrypoint sh "$IMAGE:$VERSION" \
            -c 'test -s /opt/proser/LICENSE && test -s /opt/proser/NOTICE'
          # The runtime image ships no package manager.
          docker run --rm --network none --entrypoint sh "$IMAGE:$VERSION" \
            -c 'for tool in npm npx corepack yarn yarnpkg; do if command -v "$tool"; then exit 1; fi; done; test ! -e /usr/local/lib/node_modules'
          bash scripts/check-release-image.sh "$IMAGE:$VERSION"
      - name: Start and verify the prebuilt image with fresh volumes
        run: bash scripts/smoke-compose-image.sh "$IMAGE:$VERSION" "$REVISION"
      - name: Rehearse backup and restore with the image
        run: bash scripts/test-compose-backup.sh "$IMAGE:$VERSION"
      - name: Upgrade a previous release installation to the image
        run: |
          set -euo pipefail
          if [ -z "$PREVIOUS" ]; then
            echo "No earlier release to upgrade from" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Releases up to v1.0.7 were published for linux/amd64 only.
          platforms=$(docker manifest inspect "$IMAGE:${PREVIOUS#v}" \
            | jq -r 'if .manifests then .manifests[].platform | "\(.os)/\(.architecture)" else "linux/amd64" end')
          if ! grep -Fxq "$PLATFORM" <<<"$platforms"; then
            echo "$PREVIOUS has no $PLATFORM image; the $ARCH upgrade test is skipped" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          docker pull --platform "$PLATFORM" "$IMAGE:${PREVIOUS#v}"
          bash scripts/smoke-compose-upgrade.sh "$PREVIOUS" "$IMAGE:${PREVIOUS#v}" "$IMAGE:$VERSION"
      - name: Push the verified architecture image
        if: needs.acceptance.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          if docker manifest inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "The release image tag already exists" >&2
            exit 1
          fi
          # A staging tag per architecture; the publish job combines them under the version tag.
          docker tag "$IMAGE:$VERSION" "$IMAGE:$VERSION-$ARCH"
          docker push "$IMAGE:$VERSION-$ARCH" | tee "$RUNNER_TEMP/proser-image-push.log"
          digest=$(awk '/digest: sha256:/ { print $3 }' "$RUNNER_TEMP/proser-image-push.log")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          # shellcheck disable=SC2016 # Markdown code spans, not expansions.
          printf 'Pushed `%s:%s-%s` at `%s`\n' "$IMAGE" "$VERSION" "$ARCH" "$digest" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [acceptance, build]
    if: needs.acceptance.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    env:
      VERSION: ${{ needs.acceptance.outputs.version }}
      IMAGE: ghcr.io/hivemagnus/proser
    steps:
      - name: Publish the multi-architecture version tag
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          if docker manifest inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "The release image tag already exists" >&2
            exit 1
          fi
          sources=()
          for arch in amd64 arm64; do
            digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION-$arch" --format '{{json .Manifest}}' | jq -r .digest)
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            sources+=("$IMAGE@$digest")
          done
          docker buildx imagetools create --tag "$IMAGE:$VERSION" "${sources[@]}"
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          platforms=$(docker buildx imagetools inspect "$IMAGE@$digest" --raw \
            | jq -r '[.manifests[].platform | "\(.os)/\(.architecture)"] | sort | join(",")')
          test "$platforms" = "linux/amd64,linux/arm64"
          printf 'image=%s\ndigest=%s\n' "$IMAGE" "$digest" >> "$GITHUB_OUTPUT"
          # shellcheck disable=SC2016 # Markdown code spans, not expansions.
          printf 'Published `%s:%s` (%s) at `%s`\n' "$IMAGE" "$VERSION" "$platforms" "$digest" >> "$GITHUB_STEP_SUMMARY"

  attest:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    steps:
      - name: Authenticate to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.publish.outputs.image }}
          subject-digest: ${{ needs.publish.outputs.digest }}
          push-to-registry: true
